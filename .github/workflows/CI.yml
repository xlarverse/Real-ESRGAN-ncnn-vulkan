name: Build Termux ARM64

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable ARM64 Architecture & Install Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake build-essential glslang-tools
          sudo apt-get install -y libvulkan-dev:arm64 libvulkan1:arm64

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
                -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                -DCMAKE_BUILD_TYPE=Release \
                -DNCNN_VULKAN=ON \
                -DNCNN_BUILD_BENCHMARK=OFF \
                ../src

      - name: Compile with Make
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: realesrgan-arm64
          path: build/realesrgan-ncnn-vulkan
